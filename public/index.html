<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Pilot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app" data-state="loading">

    <!-- Connection / status ribbon -->
    <header class="topbar">
      <span id="deviceName" class="device">—</span>
      <span id="conn" class="conn" title="connection">connecting…</span>
    </header>

    <!-- Main display -->
    <main class="display">
      <div id="banner" class="banner banner--standby">
        <span id="bannerText" class="banner__text">STANDBY</span>
        <span id="engLamp" class="banner__lamp" aria-hidden="true"></span>
      </div>

      <!-- Linear heading tape (GHC 20 style): red→green off-course gradient, tick scale,
           fixed center vessel marker (= current heading), moving cyan target bug. -->
      <div class="tape-wrap">
        <svg id="tape" class="tape" viewBox="0 0 600 108" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="tapeGrad" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0"    stop-color="#f2495c" />
              <stop offset="0.34" stop-color="#5a1420" />
              <stop offset="0.5"  stop-color="#0b0f14" />
              <stop offset="0.66" stop-color="#14421f" />
              <stop offset="1"    stop-color="#35e08a" />
            </linearGradient>
          </defs>

          <rect class="tape__grad" x="0" y="2" width="600" height="20" rx="3" fill="url(#tapeGrad)" />
          <g id="tapeTicks"></g>

          <!-- moving target bug -->
          <g id="tapeTarget" style="display:none">
            <polygon class="tape__bug" points="300,60 289,74 311,74" />
            <text id="tapeTargetLabel" class="tape__bug-label" x="300" y="94" text-anchor="middle">--</text>
          </g>

          <!-- fixed center marker = current heading -->
          <g class="tape__boat" transform="translate(300 46)">
            <path class="tape__hull" d="M0,-22 C9,-11 9,9 0,22 C-9,9 -9,-11 0,-22 Z" />
            <path class="tape__drop" d="M0,-14 C6,-6 6,2 0,6 C-6,2 -6,-6 0,-14 Z" />
          </g>
        </svg>
      </div>

      <div class="readout">
        <span id="heading" class="heading">---</span><span class="heading__unit">°<span class="heading__m">M</span></span>
      </div>

      <!-- rudder angle bar -->
      <div class="rudder">
        <div class="rudder__track">
          <div class="rudder__center"></div>
          <div id="rudderFill" class="rudder__fill"></div>
        </div>
        <div class="rudder__label">RUDDER</div>
      </div>

      <!-- data strip -->
      <div class="strip">
        <div class="strip__cell"><span class="k">TGT</span><span id="target" class="v">--</span></div>
        <div class="strip__cell"><span class="k">AWA</span><span id="awa" class="v">--</span></div>
        <div class="strip__cell"><span class="k">COG</span><span id="cog" class="v">--</span></div>
        <div class="strip__cell"><span class="k">STW</span><span id="stw" class="v">--</span></div>
      </div>
    </main>

    <!-- Control zone (Phase 2+ will wire these). Rendered read-only-disabled for now. -->
    <nav class="controls" aria-label="autopilot controls">
      <div class="controls__row">
        <button class="btn btn--standby" data-cmd="standby" disabled>STANDBY</button>
        <button class="btn btn--auto" data-cmd="auto" disabled>AUTO</button>
      </div>
      <div class="controls__row controls__adjust">
        <button class="btn btn--adj" data-cmd="adjust" data-deg="-10" disabled>−10</button>
        <button class="btn btn--adj" data-cmd="adjust" data-deg="-1" disabled>−1</button>
        <button class="btn btn--adj" data-cmd="adjust" data-deg="1" disabled>+1</button>
        <button class="btn btn--adj" data-cmd="adjust" data-deg="10" disabled>+10</button>
      </div>
      <div id="modeRow" class="controls__row controls__modes"></div>
      <div id="actionRow" class="controls__row controls__actions"></div>
    </nav>

    <!-- Fallback / error overlay -->
    <div id="overlay" class="overlay" hidden>
      <div class="overlay__card">
        <div id="overlayMsg" class="overlay__msg"></div>
        <button id="overlayBtn" class="btn" hidden></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
